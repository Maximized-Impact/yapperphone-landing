[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/gift/success"
  to = "/gift-success.html"
  status = 200

[[redirects]]
  from = "/originals/success"
  to = "/originals-success.html"
  status = 200

# /research moved to the Institute site - keep above the catch-all
[[redirects]]
  from = "/research"
  to = "https://research.maximized-impact.org/"
  status = 301
  force = true

[[redirects]]
  from = "/research/*"
  to = "https://research.maximized-impact.org/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
